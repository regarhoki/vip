<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>REGAR HOKI - VIP ACCESS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    @import url('https://fonts.cdnfonts.com/css/ds-digital');
    :root { --bg-color: #000; --text-color: #fff; --card-bg: #111; --card-border: rgba(255,255,255,0.08); --accent-gold: #D4AF37; --neon-yellow: #facc15; --neon-orange: #fb923c; --neon-blue: #38bdf8; }
    body.light-mode { --bg-color: #f0f2f5; --text-color: #1a1a1a; --card-bg: #fff; --card-border: rgba(0,0,0,0.08); }
    body { background: var(--bg-color); color: var(--text-color); font-family: 'Rajdhani', sans-serif; margin: 0; padding: 0; transition: 0.4s; overflow-x: hidden; }
    
    /* HEADER & TABS */
    .app-header { display: flex; align-items: center; padding: 15px; background: var(--card-bg); border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 1000; }
    .header-logo { width: 35px; height: 35px; margin-right: 12px; border-radius: 5px; }
    .header-title { font-family: 'Montserrat'; font-weight: 900; color: var(--accent-gold); font-size: 16px; text-transform: uppercase; }
    .tab-container { text-align: center; margin: 20px 0; }
    .tab-menu { display: inline-flex; background: var(--card-bg); padding: 6px; border-radius: 50px; border: 1px solid var(--card-border); }
    .tab-btn { border: none; background: transparent; color: #888; padding: 10px 20px; border-radius: 50px; font-weight: 700; font-size: 11px; cursor: pointer; }
    #b0.active { background: var(--neon-yellow); color: #000; }
    #b1.active { background: var(--neon-orange); color: #000; }
    #b2.active { background: var(--neon-blue); color: #000; }

    /* CARDS & ANIMATIONS */
    .grid-container { display: none; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 15px; }
    .grid-container.active { display: grid; }
    .card-mini { background: var(--card-bg); border-radius: 25px; padding-bottom: 15px; border: 1px solid var(--card-border); text-align: center; cursor: pointer; }
    .cm-title { font-family: 'Montserrat'; font-weight: 900; font-size: 13px; padding-top: 15px; }
    .cm-timer-value { font-family: 'DS-Digital'; font-size: 28px; margin: 10px 0; }
    .cm-btn { width: 85%; padding: 10px; border-radius: 12px; border: none; font-weight: 900; font-size: 10px; cursor: pointer; }

    /* RED PULSE & LOADING */
    @keyframes pulse-red { 0% { background: #ff0000; } 70% { background: #aa0000; box-shadow: 0 0 0 10px rgba(255,0,0,0); } 100% { background: #ff0000; } }
    .btn-pulse-red { animation: pulse-red 1.5s infinite !important; color: #fff !important; }
    .btn-loading { color: transparent !important; pointer-events: none; }
    .btn-loading::after { content: ""; position: absolute; width: 20px; height: 20px; top: 50%; left: 50%; margin: -10px 0 0 -10px; border: 3px solid rgba(0,0,0,0.2); border-top-color: #000; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* MODAL & LOGIN */
    #login-screen { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .login-box { text-align: center; width: 100%; max-width: 320px; }
    .login-box input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #333; background: #111; color: #fff; margin: 20px 0; text-align: center; font-size: 18px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .modal-content { background: var(--card-bg); border-radius: 30px; width: 90%; max-width: 400px; max-height: 85vh; overflow-y: auto; padding-bottom: 20px; border: 1px solid var(--card-border); position: relative; }
    .btn-pasang { display: block; width: 85%; margin: 20px auto; padding: 15px; border-radius: 15px; background: var(--accent-gold); color: #000; text-decoration: none; font-weight: 900; text-align: center; animation: heartbeat 1.5s infinite; }
    @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .modal-table { width: 100%; border-collapse: collapse; }
    .modal-table td { padding: 8px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .val-text { text-align: right; font-weight: 900; }
  </style>
</head>
<body onload="initApp()">

  <div id="login-screen">
    <div class="login-box">
      <img src="https://i.postimg.cc/43Q4SGNF/SCR-20260410-ousn.png" style="width:120px; margin-bottom:20px;">
      <h2 style="font-family:'Montserrat'; color:var(--accent-gold); margin:0;">REGAR HOKI</h2>
      <p style="color:#fff; font-weight:900; margin-top:-5px;">VIP ACCESS</p>
      <input type="password" id="sandiInput" placeholder="PIN MEMBER" inputmode="numeric">
      <button onclick="manualLogin()" style="width:100%; padding:15px; border-radius:12px; background:var(--accent-gold); font-weight:900; cursor:pointer; position:relative;">MASUK SISTEM</button>
      <div id="pesan-error" style="color:#ff4444; font-size:12px; margin-top:10px; display:none; font-weight:bold;">PIN INVALID!</div>
    </div>
  </div>

  <div id="main-app">
    <header class="app-header">
      <img src="https://i.postimg.cc/43Q4SGNF/SCR-20260410-ousn.png" class="header-logo">
      <div class="header-title">REGAR HOKI VIP</div>
    </header>
    <div class="tab-container">
      <div class="tab-menu">
        <button id="b0" class="tab-btn active" onclick="openTab(0)">Pagi</button>
        <button id="b1" class="tab-btn" onclick="openTab(1)">Siang</button>
        <button id="b2" class="tab-btn" onclick="openTab(2)">Malam</button>
      </div>
    </div>
    <div id="g0" class="grid-container active"></div>
    <div id="g1" class="grid-container"></div>
    <div id="g2" class="grid-container"></div>
  </div>

  <a href="#" target="_blank" id="wa-floating" style="position:fixed; bottom:20px; right:20px; background:#25d366; width:60px; height:60px; border-radius:50%; display:none; align-items:center; justify-content:center; border:3px solid #fff; z-index:2000;">
    <svg width="30" height="30" fill="#fff" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.414 0 .004 5.411.001 12.045c0 2.12.554 4.188 1.597 6.011L0 24l6.135-1.61a11.77 11.77 0 005.911 1.586h.006c6.635 0 12.044-5.411 12.048-12.047 0-3.214-1.252-6.234-3.526-8.509z"/></svg>
  </a>

  <div id="prediksiModal" class="modal"><div class="modal-content"><span onclick="closeModal()" style="position:absolute; right:15px; top:15px; color:var(--accent-gold); font-weight:bold; cursor:pointer;">&times; CLOSE</span><div id="modalBody" style="padding-top:20px;"></div></div></div>

  <script>
    const API_URL = "MASUKKAN_URL_WEBAPP_GAS_KAMU_DISINI";
    let LINK_PASANG_SEKARANG = ""; let globalPrediksiData = []; let currentActiveTab = 0;

    const jadwalPasaran = { "totomacau pagi": { time: "00:00", off: [] }, "singapore": { time: "17:30", off: [2, 5] }, "hongkong lotto": { time: "22:59", off: [] } /* Tambah yang lain sesuai list sebelumnya */ };

    function initApp() {
      const savedTheme = localStorage.getItem('app_theme');
      if (savedTheme === 'light') document.body.classList.add('light-mode');
      
      fetch(`${API_URL}?action=getPublicSettings`)
        .then(res => res.json())
        .then(s => { if(s && s.wa) updateDynamicLinks(s.wa, s.referral); });

      const savedSandi = localStorage.getItem('member_sandi');
      if (savedSandi) autoLogin(savedSandi);
      else document.getElementById('login-screen').style.display = 'flex';
    }

    function updateDynamicLinks(wa, ref) {
      const waUrl = "https://wa.me/" + wa.toString().replace(/\D/g, '');
      document.getElementById('wa-floating').href = waUrl;
      document.getElementById('wa-floating').style.display = 'flex';
      LINK_PASANG_SEKARANG = ref;
    }

    function manualLogin() {
      let sandi = document.getElementById('sandiInput').value;
      let btn = document.querySelector('.login-box button');
      btn.classList.add('btn-loading');
      
      fetch(`${API_URL}?action=getPrediksiData&sandi=${sandi}`)
        .then(res => res.json())
        .then(response => {
          btn.classList.remove('btn-loading');
          if (response === "SALAH") document.getElementById('pesan-error').style.display = 'block';
          else { localStorage.setItem('member_sandi', sandi); handleDataSuccess(response); }
        });
    }

    function autoLogin(sandi) {
      fetch(`${API_URL}?action=getPrediksiData&sandi=${sandi}`)
        .then(res => res.json()).then(response => { if (response !== "SALAH") handleDataSuccess(response); });
    }

    function handleDataSuccess(response) {
      document.getElementById('login-screen').style.display = 'none';
      globalPrediksiData = response.cards;
      if (response.wa && response.referral) updateDynamicLinks(response.wa, response.referral);
      openTab(0);
      setInterval(updateAllTimers, 1000);
    }

    function generateCardHTML(item, tabIdx) {
      const colors = ['var(--neon-yellow)', 'var(--neon-orange)', 'var(--neon-blue)'];
      const isKosong = !item.bbfs || item.bbfs.trim() === "" || item.bbfs === "-";
      let btnLabel = isKosong ? "HUBUNGI ADMIN" : "PREDIKSI";
      let btnClass = "cm-btn" + (isKosong ? " btn-pulse-red" : "");
      let btnStyle = isKosong ? "" : `background:${colors[tabIdx]}`;

      return `<div class="card-mini" data-pasaran="${item.pasaran}" onclick="showModalDirect('${btoa(JSON.stringify(item))}')">
        <div class="cm-title">${item.pasaran}</div><div style="font-size:10px; color:#666;">${item.tanggal}</div>
        <div class="cm-timer-value">00:00:00</div>
        <button class="${btnClass}" style="${btnStyle}">${btnLabel}</button></div>`;
    }

    function openTab(idx) {
      currentActiveTab = idx;
      for(let i=0; i<3; i++) {
        document.getElementById('g'+i).classList.toggle('active', i===idx);
        document.getElementById('b'+i).classList.toggle('active', i===idx);
        const g = document.getElementById('g' + i);
        if(globalPrediksiData[i]) g.innerHTML = globalPrediksiData[i].map(it => generateCardHTML(it, i)).join('');
      }
    }

    function showModalDirect(enc) {
      const it = JSON.parse(atob(enc));
      const modalBody = document.getElementById('modalBody');
      const isKosong = !it.bbfs || it.bbfs.trim() === "" || it.bbfs === "-";

      if (isKosong) {
        modalBody.innerHTML = `<div style="text-align:center; padding:30px;">
          <h3 style="color:#ff4444;">ANGKA SEDANG DIRACIK</h3><p>SILAHKAN HUBUNGI WA REGAR</p>
          <a href="${document.getElementById('wa-floating').href}" target="_blank" class="btn-pasang" style="background:#25d366; color:#fff;">KIRIM PESAN WA</a></div>`;
      } else {
        modalBody.innerHTML = `<div style="text-align:center;"><h3>${it.pasaran}</h3><p style="font-size:11px;">${it.tanggal}</p></div>
          <table class="modal-table">
            <tr><td>BBFS 7D</td><td class="val-text">${it.bbfs}</td></tr>
            <tr><td>4D (BB)</td><td class="val-text">${it.d4}</td></tr>
            <tr><td>2D (BB)</td><td class="val-text">${it.d2}</td></tr>
          </table>
          <a href="${LINK_PASANG_SEKARANG}" target="_blank" class="btn-pasang">HAJAR SEKARANG 🎰</a>`;
      }
      document.getElementById('prediksiModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('prediksiModal').style.display = 'none'; }
    function updateAllTimers() { /* Logika timer sama seperti sebelumnya */ }
  </script>
</body>
</html>
